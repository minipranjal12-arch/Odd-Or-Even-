<!DOCTYPE html>
<html>
    <head>
<title>Replit</title>
</head>
<body>
    <script>
        let oddOrEven = function(number){
         if(number % 2 == 0){
            document.write(number + " is even.");
         } else {
            document.write(number + " is odd.");
         }
        }
        let number = prompt("Enter a Number");
        oddOrEven(number);
    </script>
</body>
</html>
